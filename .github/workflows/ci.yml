name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check copyright and GPL notices
        run: tools/check-license-headers.sh

      - name: Build and run unit tests
        # Ad-hoc signing (`-`): CI has no access to the developer's signing
        # certificate, and unit tests don't need one.
        # TEST_RUNNER_VIEWMD_SKIP_PERF reaches the tests as VIEWMD_SKIP_PERF
        # and skips the timing checks (REQ-012), which only hold on a
        # developer Mac, not a shared runner.
        env:
          TEST_RUNNER_VIEWMD_SKIP_PERF: "1"
        run: |
          xcodebuild test \
            -project viewMD.xcodeproj \
            -scheme viewMD \
            -destination 'platform=macOS' \
            -only-testing:viewMDTests \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=
